server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset names never change, so they can be cached for a year.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The API runs in another container; the browser only ever talks to this origin.
    location /api/ {
        include /etc/nginx/conf.d/security-headers.inc;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # Overwrite, never append: a client-supplied X-Forwarded-For must not reach the API, or
        # anyone could dodge the login rate limit by inventing a new "address" per request.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: unknown paths serve index.html.
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
