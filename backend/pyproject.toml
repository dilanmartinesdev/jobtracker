[project]
name = "jobtracker-api"
version = "1.0.0"
description = "REST API to track job applications on a Kanban board"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "C4", "RUF", "N", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107", "E402"]
"alembic/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "scripts"]

[[tool.mypy.overrides]]
module = ["slowapi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
