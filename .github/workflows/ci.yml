name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobtracker
          POSTGRES_PASSWORD: jobtracker
          POSTGRES_DB: jobtracker_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobtracker" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://jobtracker:jobtracker@localhost:5432/jobtracker_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Types
        run: mypy
      - name: Security scan (code)
        run: bandit -r app scripts -q
      - name: Security scan (dependencies)
        run: pip-audit -r requirements.txt
      - name: Tests on SQLite
        run: pytest
      - name: Tests on PostgreSQL, with coverage gate
        run: pytest --cov
      - name: Migrations match the models
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql+psycopg://jobtracker:jobtracker@localhost:5432/jobtracker
        run: |
          PGPASSWORD=jobtracker psql -h localhost -U jobtracker -d jobtracker_test -c 'CREATE DATABASE jobtracker'
          alembic upgrade head
          alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test the whole stack
        env:
          POSTGRES_PASSWORD: ci-password
          SECRET_KEY: ci-secret-key-that-is-definitely-long-enough-0123456789
        run: |
          docker compose up -d --build --wait
          curl --fail --retry 10 --retry-delay 2 http://localhost:8080/api/health/ready
          curl --fail http://localhost:8080/ | grep -q "<title>JobTracker</title>"
          docker compose down -v
